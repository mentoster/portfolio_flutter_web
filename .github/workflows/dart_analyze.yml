name: Flutter CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Analyze, test and build web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
