server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 = @not_found;

    location @not_found {
        default_type text/plain;
        return 404 "Not found\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /canvaskit/ {
        try_files $uri =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|wasm|json|png|svg|ico|webp|jpg|jpeg|css|map|symbols)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;
}
